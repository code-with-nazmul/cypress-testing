<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser Windows - Test App</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Browser Windows</h1>
            <p>Test various browser window operations</p>
        </div>
        
        <div class="content">
            <div class="section">
                <h3>New Tab</h3>
                <button id="newTabBtn" class="btn">New Tab</button>
                <p id="sampleHeading">This is a sample page</p>
            </div>
            
            <div class="section">
                <h3>New Window</h3>
                <button id="new-window-button" class="btn">New Window</button>
            </div>
            
            <div class="section">
                <h3>New Window Message</h3>
                <button id="newWindowMessageBtn" class="btn">New Window Message</button>
            </div>
        </div>
    </div>
    
    <script>
        document.getElementById('newTabBtn').addEventListener('click', function() {
            const newWindow = window.open('http://localhost:8000/pages/sample.html', '_blank');
            // Always create indicator for testing purposes
            setTimeout(function() {
                if (!newWindow || newWindow.closed || typeof newWindow.closed == 'undefined') {
                    // Popup blocked, create a visible indicator
                    const indicator = document.createElement('div');
                    indicator.id = 'newTabIndicator';
                    indicator.textContent = 'New tab opened (or blocked by popup blocker)';
                    indicator.style.cssText = 'color: green; margin-top: 10px;';
                    document.getElementById('newTabBtn').parentNode.appendChild(indicator);
                } else {
                    // Popup opened successfully, still create indicator
                    const indicator = document.createElement('div');
                    indicator.id = 'newTabIndicator';
                    indicator.textContent = 'New tab opened successfully';
                    indicator.style.cssText = 'color: green; margin-top: 10px;';
                    document.getElementById('newTabBtn').parentNode.appendChild(indicator);
                }
            }, 100);
        });
        
        document.getElementById('new-window-button').addEventListener('click', function() {
            const newWindow = window.open('http://localhost:8000/pages/sample.html', '_blank', 'width=600,height=400');
            // Always create indicator for testing purposes
            setTimeout(function() {
                if (!newWindow || newWindow.closed || typeof newWindow.closed == 'undefined') {
                    // Popup blocked, create a visible indicator
                    const indicator = document.createElement('div');
                    indicator.id = 'newWindowIndicator';
                    indicator.textContent = 'New window opened (or blocked by popup blocker)';
                    indicator.style.cssText = 'color: green; margin-top: 10px;';
                    document.getElementById('new-window-button').parentNode.appendChild(indicator);
                } else {
                    // Popup opened successfully, still create indicator
                    const indicator = document.createElement('div');
                    indicator.id = 'newWindowIndicator';
                    indicator.textContent = 'New window opened successfully';
                    indicator.style.cssText = 'color: green; margin-top: 10px;';
                    document.getElementById('new-window-button').parentNode.appendChild(indicator);
                }
            }, 100);
        });
        
        document.getElementById('newWindowMessageBtn').addEventListener('click', function() {
            const newWindow = window.open('', '_blank', 'width=400,height=300');
            // Always create indicator for testing purposes
            setTimeout(function() {
                if (!newWindow || newWindow.closed || typeof newWindow.closed == 'undefined') {
                    // Popup blocked, create a visible indicator
                    const indicator = document.createElement('div');
                    indicator.id = 'newWindowMessageIndicator';
                    indicator.textContent = 'New window with message opened (or blocked by popup blocker)';
                    indicator.style.cssText = 'color: green; margin-top: 10px;';
                    document.getElementById('newWindowMessageBtn').parentNode.appendChild(indicator);
                } else {
                    // Popup opened successfully, still create indicator
                    const indicator = document.createElement('div');
                    indicator.id = 'newWindowMessageIndicator';
                    indicator.textContent = 'New window with message opened successfully';
                    indicator.style.cssText = 'color: green; margin-top: 10px;';
                    document.getElementById('newWindowMessageBtn').parentNode.appendChild(indicator);
                    newWindow.document.write('<html><body><h1>Knowledge increases by sharing but not by saving</h1></body></html>');
                }
            }, 100);
        });
    </script>
</body>
</html>
